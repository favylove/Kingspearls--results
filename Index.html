<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Kingspearls Learning Field</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:#F0F4FF;color:#1E293B;min-height:100vh;}
:root{--navy:#0D1B3E;--royal:#1A3A8F;--gold:#F5A623;--amber:#E8920A;
  --green:#16A34A;--red:#DC2626;--slate:#64748B;--border:#D1D9F0;
  --light:#EEF2FF;--white:#fff;--purple:#7C3AED;}

#nav{background:var(--navy);display:flex;align-items:center;gap:4px;padding:0 12px;
  position:sticky;top:0;z-index:99;min-height:56px;flex-wrap:wrap;}
#nav .logo{display:flex;align-items:center;gap:8px;margin-right:auto;padding:8px 0;}
#nav .logo img{width:38px;height:38px;border-radius:8px;object-fit:cover;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.3);}
#nav .logo .name{color:#fff;font-weight:900;font-size:15px;line-height:1.1;letter-spacing:.2px;}
#nav .logo .sub{color:var(--gold);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;}
.nav-btn{background:transparent;color:#94A3B8;border:none;border-radius:7px;
  padding:6px 10px;font-size:12px;cursor:pointer;font-weight:500;white-space:nowrap;transition:all .15s;}
.nav-btn.active,.nav-btn:hover{background:var(--gold);color:var(--navy);font-weight:700;}
.nav-label{display:none;}
@media(min-width:600px){.nav-label{display:inline;margin-left:4px;}}

.page{display:none;max-width:1000px;margin:0 auto;padding:18px 14px;}
.page.active{display:block;}
.card{background:#fff;border-radius:13px;border:1px solid var(--border);
  box-shadow:0 2px 10px rgba(13,27,62,.07);padding:18px;margin-bottom:16px;}
.card-title{font-weight:700;color:var(--navy);font-size:15px;margin-bottom:14px;}

label.lbl{font-size:12px;font-weight:600;color:var(--slate);display:block;margin-bottom:5px;}
input,select,textarea{width:100%;border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;font-size:14px;color:#1E293B;background:#fff;outline:none;
  -webkit-appearance:none;appearance:none;font-family:inherit;}
input:focus,select:focus,textarea:focus{border-color:var(--royal);box-shadow:0 0 0 3px rgba(26,58,143,.1);}
textarea{resize:vertical;min-height:70px;}
.fg{margin-bottom:13px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:480px){.g2,.g3{grid-template-columns:1fr;}}

.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:9px;
  padding:11px 20px;font-weight:700;font-size:14px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn:active{opacity:.8;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg,var(--royal),var(--navy));color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15);}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--amber));color:var(--navy);box-shadow:0 3px 10px rgba(0,0,0,.1);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--slate);}
.btn-red{background:#FEF2F2;color:var(--red);border:1px solid #FECACA;}
.btn-green{background:#F0FDF4;color:var(--green);border:1px solid #BBF7D0;}
.btn-sm{padding:7px 13px;font-size:12px;border-radius:7px;}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}

.badge{display:inline-block;border-radius:6px;padding:3px 9px;font-weight:700;font-size:12px;}

.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{padding:10px 12px;text-align:left;font-size:12px;font-weight:700;
  background:var(--navy);color:#fff;white-space:nowrap;}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:nth-child(even) td{background:#F8FAFF;}
.score-inp{width:56px;border:1px solid var(--border);border-radius:6px;
  padding:5px 6px;font-size:13px;text-align:center;outline:none;}
.comment-inp{width:170px;border:1px solid var(--border);border-radius:6px;
  padding:5px 8px;font-size:12px;outline:none;}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px;}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr);}}
.stat-card{background:#fff;border-radius:12px;border:1px solid var(--border);
  padding:16px;border-left:4px solid var(--royal);}
.stat-val{font-size:26px;font-weight:900;color:var(--royal);}
.stat-lbl{font-size:12px;color:var(--slate);margin-top:2px;}

#login-wrap,#pending-wrap{min-height:100vh;background:linear-gradient(135deg,var(--navy),var(--royal));
  display:flex;align-items:center;justify-content:center;padding:20px;}
#login-box,#pending-box{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:420px;}
.login-logo{text-align:center;margin-bottom:24px;}
.login-logo img{width:84px;height:84px;border-radius:18px;object-fit:cover;margin:0 auto 14px;display:block;box-shadow:0 4px 14px rgba(0,0,0,.25);}
.login-logo h1{color:var(--navy);font-size:23px;font-weight:900;letter-spacing:-.3px;line-height:1.2;}
.login-logo p{color:var(--slate);font-size:13px;margin-top:6px;font-weight:600;}
.err-box{color:var(--red);background:#FEF2F2;padding:9px 13px;border-radius:7px;font-size:13px;margin-bottom:12px;}
.ok-box{color:var(--green);background:#F0FDF4;padding:9px 13px;border-radius:7px;font-size:13px;margin-bottom:12px;}
.hint-box{background:var(--light);border-radius:9px;padding:13px;font-size:12px;color:var(--slate);margin-top:16px;}
.switch-link{text-align:center;margin-top:16px;font-size:13px;color:var(--slate);}
.switch-link a{color:var(--royal);font-weight:700;cursor:pointer;text-decoration:none;}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:62px;}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  background:var(--light);color:var(--royal);border:none;border-radius:6px;
  padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.5px;}
.pw-toggle:active{opacity:.7;}

.rc-header{background:linear-gradient(135deg,var(--navy),var(--royal));
  padding:22px 24px;color:#fff;display:flex;align-items:center;gap:14px;}
.rc-header img{width:62px;height:62px;border-radius:14px;object-fit:cover;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.3);}
.rc-info-bar{background:var(--light);padding:13px 20px;display:flex;flex-wrap:wrap;gap:18px;
  border-bottom:1px solid var(--border);}
.ri-item .ri-l{font-size:10px;color:var(--slate);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.ri-item .ri-v{font-size:14px;font-weight:700;color:var(--navy);}

.domain-row{display:flex;justify-content:space-between;align-items:center;
  padding:8px 16px;border-bottom:1px solid var(--border);}
.domain-row:nth-child(even){background:#F8FAFF;}
.domain-label{font-size:13px;font-weight:500;color:var(--navy);}
.rating-btns{display:flex;gap:4px;}
.rbn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);
  background:#fff;font-size:11px;font-weight:700;cursor:pointer;color:var(--slate);
  display:flex;align-items:center;justify-content:center;transition:all .15s;}
.rbn.sel-5{background:#16A34A;color:#fff;border-color:#16A34A;}
.rbn.sel-4{background:#2563EB;color:#fff;border-color:#2563EB;}
.rbn.sel-3{background:#7C3AED;color:#fff;border-color:#7C3AED;}
.rbn.sel-2{background:#D97706;color:#fff;border-color:#D97706;}
.rbn.sel-1{background:#DC2626;color:#fff;border-color:#DC2626;}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--green);color:#fff;padding:11px 22px;border-radius:10px;
  font-weight:700;font-size:14px;display:none;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.2);}
#toast.err{background:var(--red);}

.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:18px;gap:0;overflow-x:auto;}
.tab-btn{padding:10px 18px;font-size:13px;font-weight:600;color:var(--slate);
  border:none;background:transparent;cursor:pointer;border-bottom:3px solid transparent;
  margin-bottom:-2px;white-space:nowrap;transition:all .15s;}
.tab-btn.active{color:var(--royal);border-bottom-color:var(--royal);}
.tab-pane{display:none;}
.tab-pane.active{display:block;}

.sec-hd{font-size:12px;font-weight:700;color:var(--royal);text-transform:uppercase;
  letter-spacing:1px;margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--light);}
.pill{display:inline-block;background:var(--light);color:var(--royal);border-radius:20px;
  padding:3px 10px;font-size:11px;font-weight:700;margin-right:6px;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-row{text-align:center;padding:30px;color:var(--slate);}

@media print{
  #login-wrap,#pending-wrap,#nav,#page-dashboard,#page-results,#page-students,#page-teachers,
  #page-register,#page-cumulative,.no-print,.btn-row{display:none!important;}
  #page-report{display:block!important;padding:0!important;}
  .card{box-shadow:none!important;border:none!important;}
  body{background:#fff;}
}
</style>
</head>
